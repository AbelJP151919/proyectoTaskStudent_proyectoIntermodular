<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskStudent - Error</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f0f0;
            overflow: hidden;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 90%;
            position: relative;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .error-icon-wrapper {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #DC3545, #c82333);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.3);
            animation: scaleIn 0.5s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .error-icon {
            font-size: 3rem;
            color: white;
            animation: shake 0.6s ease-out 0.5s both;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            10%, 30%, 50%, 70%, 90% {
                transform: translateX(-5px);
            }
            20%, 40%, 60%, 80% {
                transform: translateX(5px);
            }
        }

        .modal-content h2 {
            color: #DC3545;
            margin-bottom: 1rem;
            font-size: 1.75rem;
            font-weight: 600;
        }

        .modal-content p {
            color: #666666;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.6;
        }

        .btn-error {
            background: linear-gradient(135deg, #DC3545, #c82333);
            color: white;
            padding: 0.875rem 2.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
            width: 100%;
        }

        .btn-error:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(220, 53, 69, 0.4);
        }

        .btn-error:active {
            transform: translateY(0);
        }

        .close-hint {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #999;
        }

        @media (max-width: 576px) {
            .modal-content {
                padding: 2rem 1.5rem;
            }

            .modal-content h2 {
                font-size: 1.5rem;
            }

            .error-icon-wrapper {
                width: 70px;
                height: 70px;
            }

            .error-icon {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
<div class="modal-overlay">
    <div class="modal-content">
        <div class="error-icon-wrapper">
            <div class="error-icon">✕</div>
        </div>

        <h2>Error al enviar la entrega</h2>

        <p th:text="${mensajeError}">
            No se pudo completar la entrega. Por favor, verifica los datos e inténtalo nuevamente.
        </p>

        <!-- Botón volver al formulario -->
        <a class="btn-error"
           th:href="@{/entregas/crearEntrega/{idContenido}(idContenido=${contenido.id})}">
            Volver al formulario
        </a>

        <p class="close-hint">Presiona ESC o haz clic fuera para cerrar</p>
    </div>
</div>

<script>
    // Cerrar modal al hacer clic fuera
    document.querySelector('.modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) {
            window.location.href = '/entregas/crearEntrega/' + /*[[${idContenido}]]*/ '';
        }
    });

    // Cerrar modal con tecla Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            window.location.href = '/entregas/crearEntrega/' + /*[[${idContenido}]]*/ '';
        }
    });
</script>
</body>
</html>


</html>

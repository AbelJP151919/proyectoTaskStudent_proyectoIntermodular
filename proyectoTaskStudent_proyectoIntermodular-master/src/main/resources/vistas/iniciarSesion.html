<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskStudent - Registro De Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilosPaginaPrincipal.css">

    <style>
        .registro-container {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .registro-wrapper {
            max-width: 550px;
            width: 100%;
        }

        .registro-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .registro-header h1 {
            color: #0101E7;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .registro-header p {
            color: #666666;
            font-size: 1rem;
            margin: 0;
        }

        .form-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #0101FE, #0100BA);
            border-radius: 50%;
            color: white;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(1, 1, 254, 0.2);
        }

        .form-section {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .form-label-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .form-help-text {
            font-size: 0.875rem;
            color: #666666;
            margin-top: 0.25rem;
            display: block;
        }

        .password-requirements ul {
            margin: 0.5rem 0 0 0;
            padding-left: 1.25rem;
            color: #666666;
        }

        .password-requirements ul li {
            margin-bottom: 0.25rem;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0 1.5rem 0;
            color: #999;
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider span {
            padding: 0 1rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666666;
        }

        .login-link a {
            color: #0101FE;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .navbar-brand {
            color: white !important;
            font-size: 1.5rem;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
            transition: color 0.3s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: white !important;
        }

        @media (max-width: 576px) {
            .form-section {
                padding: 1.5rem;
            }

            .registro-header h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<header class="navbar navbar-expand-lg" style="background: linear-gradient(135deg, #0101FE, #0100BA);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">
            TaskStudent
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="background: rgba(255, 255, 255, 0.2); border: none;">
            <span class="navbar-toggler-icon" style="filter: brightness(0) invert(1);"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
            </ul>
        </div>
    </div>
</header>

<main class="registro-container flex-grow-1">
    <div class="registro-wrapper">
        <div class="registro-header">
            <div class="form-icon">👤</div>
            <h1>Inicio de Sesión</h1>

        </div>

        <div class="form-section">
            <form action="/iniciar" method="POST" id="formInicio">
                <div class="form-label-group">
                    <label for="nombreUsuario" class="form-label fw-bold">Nombre de usuario</label>
                    <input type="text" name="nombreUsuario" id="nombreUsuario" class="form-control" placeholder="miusuario">
                    <span class="form-help-text">Escribe tu nombre de usuario</span>
                </div>

                <div class="form-label-group">
                    <label for="conn" class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="conn" id="conn" class="form-control">
                    <span class="form-help-text">Escribe tu contraseña</span>
                </div>

                <div class="d-grid gap-2">
                    <input type="submit" value="Iniciar Sesion" class="btn btn-primary btn-lg">
                    <a href="/" class="btn btn-outline-primary">Cancelar</a>
                </div>

                <div class="login-link">
                    ¿Aún no tienes cuenta? <a href="/mostrarFormularioRegistro">Regístrate</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="footer bg-light py-4 border-top">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center">
        <div class="d-flex align-items-center mb-2 mb-md-0">
            <span class="fw-bold text-azul-principal fs-5">TaskStudent</span>
        </div>
        <div class="text-muted small">
            © 2025 TaskStudent. Todos los derechos reservados.
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/validaciones.mjs"></script>



</body>
</html>

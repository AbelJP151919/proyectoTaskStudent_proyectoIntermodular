<!DOCTYPE html>
<html>
<head>
    <title>Error en el Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .error-icon {
            font-size: 60px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .modal-content h2 {
            color: #dc3545;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .modal-content p {
            color: #333;
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.5;
        }

        .btn {
            background: #dc3545;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="modal">
    <div class="modal-content">
        <div class="error-icon">❌</div>
        <h2>Error de Registro</h2>
        <p th:text="${mensajeError}">Error</p>
        <button class="btn" onclick="window.location.href='/mostrarFormularioRegistro'">Volver al Formulario</button>
    </div>
</div>

<script>
    document.querySelector('.modal').addEventListener('click', function(e) {
        if (e.target === this) {
            window.location.href = '/';
        }
    });

    // Cerrar con tecla ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            window.location.href = '/';
        }
    });
</script>
</body>
</html>

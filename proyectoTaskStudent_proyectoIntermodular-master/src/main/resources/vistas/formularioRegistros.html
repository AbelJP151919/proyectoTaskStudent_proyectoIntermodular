<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TaskStudent - Registro De Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/estilosPaginaPrincipal.css">
</head>
<body class="min-vh-100">
<header class="navbar navbar-expand-lg" style="background: linear-gradient(135deg, #0101FE, #0100BA);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            TaskStudent
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Tareas</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Calendario</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
            </ul>
        </div>
    </div>
</header>
<div class="min-vh-100 d-flex align-items-center justify-content-center">
<form action="/registrar" method="POST" class="container mt-4">
    <div class="mb-3">
        <label for="nombre" class="form-label fw-bold">Nombre</label>
        <input type="text" name="nombre" id="nombre" class="form-control">
    </div>

    <div class="mb-3">
        <label for="email" class="form-label fw-bold">Email</label>
        <input type="text" name="email" id="email" class="form-control" placeholder="Ejemplo: tunombre@iescastelar.es">
    </div>

    <div class="mb-3">
        <label for="curso" class="form-label fw-bold">Curso</label>
        <select name="curso" id="curso" class="form-select">
            <option value="1ºESO">1ºESO</option>
            <option value="2ºESO">2ºESO</option>
            <option value="3ºESO">3ºESO</option>
            <option value="4ºESO">4ºESO</option>
            <option value="1ºBachillerato">1ºBachillerato</option>
            <option value="2ºBachillerato">2ºBachillerato</option>
            <option value="Formacion Profesional">Formacion Profesional</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="conn" class="form-label fw-bold">Contraseña</label>
        <input type="password" name="conn" id="conn" class="form-control" placeholder="Min 8 caracteres">
    </div>

    <div class="mb-3">
        <label for="conn2" class="form-label fw-bold">Confirmar Contraseña</label>
        <input type="password" name="conn2" id="conn2" class="form-control">
    </div>

    <div class="d-flex gap-3">
        <input type="submit" value="Registrarme" class="btn btn-primary">
        <a href="/" class="btn btn-outline-primary">Volver</a>
    </div>
</form>
</div>

<footer class="footer bg-light py-4 border-top">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center">
        <div class="d-flex align-items-center mb-2 mb-md-0">
            <span class="fw-bold text-azul-principal fs-5">TaskStudent</span>
        </div>
        <div class="text-muted small">
            © 2025 TaskStudent. Todos los derechos reservados.
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Eliminar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f0f0;
            overflow: hidden;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .warning-icon-wrapper {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #FFC107, #FF9800);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3);
        }

        .warning-icon {
            font-size: 3rem;
            color: white;
        }

        h2 {
            color: #FF9800;
            margin-bottom: 1rem;
            font-size: 1.75rem;
            font-weight: 600;
        }

        p {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.6;
        }

        .btn-danger {
            background: linear-gradient(135deg, #DC3545, #c82333);
            color: white;
            padding: 0.875rem 2.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            margin-bottom: 1rem;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 0.875rem 2.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
        }

        .btn-danger:hover { opacity: 0.9; }
        .btn-secondary:hover { opacity: 0.9; }
    </style>
</head>

<body>

<div class="modal-overlay">
    <div class="modal-content">

        <div class="warning-icon-wrapper">
            <div class="warning-icon">⚠️</div>
        </div>

        <h2 th:text="${titulo}">¿Eliminar?</h2>

        <p th:text="${mensaje}">Esta acción no se puede deshacer.</p>

        <form method="post" th:action="${accion}">
            <button class="btn-danger" type="submit">Eliminar definitivamente</button>
        </form>

        <a th:href="${cancelar}" class="btn-secondary">Cancelar</a>

    </div>
</div>

</body>
</html>
